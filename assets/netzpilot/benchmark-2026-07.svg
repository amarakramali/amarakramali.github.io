<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title desc">
  <title id="title">NetzPilot public-data benchmark, July 2026</title>
  <desc id="desc">Clean benchmark summary and selected table rows. NetzPilot significantly beats the seasonal-naive baseline on 74 of 76 public load series, with 23.1 percent median skill and 80.2 percent mean P10 to P90 coverage.</desc>

  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0FDFA"/>
      <stop offset="1" stop-color="#ECFEFF"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0F172A" flood-opacity=".08"/>
    </filter>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #172033; }
      .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 1.5px; fill: #0F766E; }
      .title { font-size: 30px; font-weight: 750; letter-spacing: -.4px; }
      .subtitle { font-size: 15px; fill: #64748B; }
      .metric { font-size: 30px; font-weight: 780; fill: #0F766E; }
      .metric-label { font-size: 11px; font-weight: 700; letter-spacing: .8px; fill: #64748B; }
      .section { font-size: 16px; font-weight: 750; letter-spacing: .5px; }
      .head { font-size: 10.5px; font-weight: 750; letter-spacing: .55px; fill: #64748B; }
      .cell { font-size: 13px; }
      .num { font-size: 13px; font-variant-numeric: tabular-nums; }
      .skill { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
      .ci { font-size: 10.5px; fill: #64748B; font-variant-numeric: tabular-nums; }
      .note { font-size: 11.5px; fill: #64748B; }
      .line { stroke: #DCE5EE; stroke-width: 1; }
      .row-alt { fill: #F8FAFC; }
      .ok { fill: #0F9D84; }
      .neutral { fill: #FFFFFF; stroke: #94A3B8; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1440" height="1120" fill="#FFFFFF"/>
  <rect x="20" y="20" width="1400" height="1080" rx="24" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>

  <text x="52" y="62" font-size="24" font-weight="800">Netz<tspan fill="#0F9D84">Pilot</tspan></text>
  <text x="1388" y="59" text-anchor="end" class="eyebrow">PUBLIC-DATA BASELINE · 2 JULY 2026</text>
  <line x1="52" y1="84" x2="1388" y2="84" stroke="#0F9D84" stroke-width="2"/>

  <text x="52" y="130" class="title">Day-ahead load forecasting for municipal utilities — validated results</text>
  <text x="52" y="162" class="subtitle">Leakage-safe rolling-origin evaluation · seasonal-naive and persistence baselines · 10,000 paired block-bootstrap resamples per series</text>

  <g transform="translate(52 190)">
    <rect width="318" height="96" rx="14" fill="url(#card)" stroke="#BFE9E2"/>
    <text x="22" y="43" class="metric">74 / 76</text>
    <text x="22" y="70" class="metric-label">SIGNIFICANT VS SEASONAL-NAIVE</text>
  </g>
  <g transform="translate(388 190)">
    <rect width="318" height="96" rx="14" fill="url(#card)" stroke="#BFE9E2"/>
    <text x="22" y="43" class="metric">+23.1%</text>
    <text x="22" y="70" class="metric-label">MEDIAN FORECAST SKILL</text>
  </g>
  <g transform="translate(724 190)">
    <rect width="318" height="96" rx="14" fill="url(#card)" stroke="#BFE9E2"/>
    <text x="22" y="43" class="metric">80.2%</text>
    <text x="22" y="70" class="metric-label">MEAN P10–P90 COVERAGE</text>
  </g>
  <g transform="translate(1060 190)">
    <rect width="328" height="96" rx="14" fill="url(#card)" stroke="#BFE9E2"/>
    <text x="22" y="43" class="metric">67 / 76</text>
    <text x="22" y="70" class="metric-label">SERIES WITH MASE &lt; 1</text>
  </g>

  <text x="52" y="334" class="section">Benchmark excerpt — selected public German distribution-grid load series</text>
  <text x="1388" y="334" text-anchor="end" class="subtitle">✓ significant · ○ not significant</text>

